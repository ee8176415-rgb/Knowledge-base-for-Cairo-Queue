<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informa Egypt — CS Knowledge Base</title>
<style>
  :root{
    --brand:#12c2e9; --brand-2:#0094c8; --deep:#04121c;
    --ink:#eaf7fd; --muted:#8fc7de;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; background:var(--deep); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  a{color:inherit;text-decoration:none}

  /* ---------- animated aurora background ---------- */
  .aurora{position:fixed;inset:0;z-index:0;overflow:hidden;background:
     radial-gradient(120% 90% at 50% 8%, #0a3a52 0%, #06202e 45%, #04121c 100%)}
  .blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;will-change:transform}
  .b1{width:52vmax;height:52vmax;left:-14vmax;top:-16vmax;
      background:radial-gradient(circle,#0094c8 0%,rgba(0,148,200,0) 70%);animation:drift1 26s ease-in-out infinite}
  .b2{width:46vmax;height:46vmax;right:-12vmax;bottom:-14vmax;
      background:radial-gradient(circle,#12c2e9 0%,rgba(18,194,233,0) 70%);animation:drift2 32s ease-in-out infinite}
  .b3{width:38vmax;height:38vmax;left:52%;top:58%;
      background:radial-gradient(circle,#1a9e6a 0%,rgba(26,158,106,0) 70%);opacity:.32;animation:drift3 38s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(9vmax,6vmax) scale(1.15)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-8vmax,-7vmax) scale(1)}}
  @keyframes drift3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-42%,-58%) scale(1.2)}}
  .grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.35;
    background-image:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1px);
    background-size:34px 34px;mask-image:radial-gradient(75% 65% at 50% 45%,#000 0%,transparent 100%);
    -webkit-mask-image:radial-gradient(75% 65% at 50% 45%,#000 0%,transparent 100%)}

  /* ---------- top brand line ---------- */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:12px;
    padding:20px clamp(16px,4vw,40px);animation:fadeDown .9s .15s both}
  .diamond{width:26px;height:26px;flex:none;transform:rotate(45deg);border-radius:6px;
    background:linear-gradient(135deg,#12c2e9,#0094c8);box-shadow:0 6px 18px rgba(0,148,200,.65)}
  .topbar b{font-size:15px;letter-spacing:.3px}
  .topbar .by{font-size:12px;color:var(--muted);opacity:.9}
  .topbar .right{margin-left:auto;display:flex;gap:8px}
  .tlink{font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:999px;color:#cdeaf7;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);transition:.18s;white-space:nowrap}
  .tlink:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
  @media(max-width:640px){.topbar .by{display:none}.topbar b{font-size:13px}}

  /* ---------- stage ---------- */
  .stage{position:relative;z-index:4;width:min(92vw,78vh,780px);aspect-ratio:1;
    display:grid;place-items:center;animation:enter 1.2s cubic-bezier(.16,1,.3,1) both}
  @keyframes enter{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  /* chips are positioned by JS every frame — fade them in with opacity only,
     an animated transform here would override the orbit position */
  @keyframes chipIn{from{opacity:0}to{opacity:1}}

  .web{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  /* out of flow, otherwise it takes a grid row and pushes the core off centre */
  #nodes{position:absolute;inset:0}
  .web line{stroke:rgba(18,194,233,.28);stroke-width:1}
  .web polygon{fill:rgba(18,194,233,.05);stroke:rgba(18,194,233,.18);stroke-width:1}

  .ring{position:absolute;border-radius:50%;border:1px solid rgba(143,199,222,.16);will-change:transform}
  .r1{width:44%;height:44%;border-style:dashed;border-color:rgba(18,194,233,.28)}
  .r2{width:68%;height:68%}
  .r3{width:94%;height:94%;border-style:dotted;border-color:rgba(143,199,222,.22)}

  /* ---------- orbiting event chips ---------- */
  .node{position:absolute;left:50%;top:50%;display:flex;align-items:center;gap:7px;
    padding:8px 14px;border-radius:999px;white-space:nowrap;cursor:pointer;
    background:rgba(9,32,46,.72);border:1px solid rgba(143,199,222,.25);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-size:13px;font-weight:600;color:#dcf1fb;will-change:transform;
    box-shadow:0 10px 26px -16px rgba(0,0,0,.9);
    transition:background .2s,border-color .2s,box-shadow .2s,color .2s}
  .node .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);flex:none;
    box-shadow:0 0 10px var(--brand)}
  .node:hover{background:linear-gradient(135deg,#12c2e9,#0094c8);color:#04202c;
    border-color:transparent;box-shadow:0 14px 34px -12px rgba(18,194,233,.75)}
  .node:hover .dot{background:#04202c;box-shadow:none}
  @media(max-width:720px){.node{font-size:10.5px;padding:6px 10px;gap:5px}.node .dot{width:5px;height:5px}}
  @media(max-width:560px){.node{font-size:9.5px;padding:5px 9px}}

  /* ---------- core button ---------- */
  .core{position:relative;display:grid;place-items:center;gap:2px;cursor:pointer;
    width:clamp(120px,30%,230px);aspect-ratio:1;border-radius:50%;border:1px solid rgba(18,194,233,.45);
    background:radial-gradient(circle at 50% 42%,rgba(18,194,233,.30),rgba(6,32,46,.90) 72%);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);font:inherit;
    box-shadow:0 0 0 1px rgba(255,255,255,.05) inset,0 24px 60px -24px rgba(18,194,233,.6);
    transition:transform .45s cubic-bezier(.16,1,.3,1),box-shadow .45s}
  .core:hover{transform:scale(1.07);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 30px 80px -20px rgba(18,194,233,.95)}
  .core .lbl{font-size:clamp(20px,3.4vmin,30px);font-weight:800;letter-spacing:2.5px}
  .core .sub{font-size:clamp(9px,1.5vmin,11.5px);letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
  .core .arrow{margin-top:6px;font-size:15px;color:var(--brand);transition:transform .3s}
  .core:hover .arrow{transform:translateY(3px)}
  .halo{position:absolute;inset:-2px;border-radius:50%;border:1px solid rgba(18,194,233,.5);
    animation:ping 3.4s cubic-bezier(.2,.6,.3,1) infinite;pointer-events:none}
  .halo:nth-of-type(2){animation-delay:1.15s}
  .halo:nth-of-type(3){animation-delay:2.3s}
  @keyframes ping{0%{transform:scale(1);opacity:.65}75%,100%{transform:scale(1.85);opacity:0}}

  /* ---------- bottom line ---------- */
  .foot{position:fixed;bottom:0;left:0;right:0;z-index:6;text-align:center;padding:0 20px 26px;
    animation:fadeUp 1s .5s both}
  .foot h1{margin:0 0 6px;font-size:clamp(15px,2.4vw,20px);font-weight:700;letter-spacing:-.2px}
  .foot p{margin:0;font-size:12.5px;color:var(--muted)}
  @media(max-height:620px){.foot h1{display:none}}

  /* ---------- warp transition ---------- */
  .warp{position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;
    background:radial-gradient(circle at 50% 50%,rgba(18,194,233,.95) 0%,rgba(4,18,28,1) 70%)}
  body.leaving .warp{opacity:1;transition:opacity .5s ease}
  body.leaving .stage{transform:scale(1.6);opacity:0;transition:transform .55s cubic-bezier(.6,0,.9,.3),opacity .5s}
  body.leaving .topbar,body.leaving .foot{opacity:0;transition:opacity .3s}

  /* phones: keep the core label inside the smaller disk (declared after .core so it wins) */
  @media(max-width:560px){
    .core .lbl{font-size:16px;letter-spacing:1.6px}
    .core .sub{font-size:8.5px;letter-spacing:1px}
    .core .arrow{margin-top:2px;font-size:12px}
  }

  @media(prefers-reduced-motion:reduce){
    .blob,.halo{animation:none}
    .stage,.topbar,.foot{animation:none}
    .core,.node{transition:none}
  }
</style>
</head>
<body>

<div class="aurora">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>
<div class="grain"></div>

<header class="topbar">
  <span class="diamond"></span>
  <b>Informa Egypt</b>
  <span class="by">· Customer Service Knowledge Base</span>
  <span class="right">
    <a class="tlink" href="templates.html">🗂️ Templates</a>
    <a class="tlink" href="events.html">All events</a>
  </span>
</header>

<div class="stage" id="stage">
  <svg class="web" id="web" aria-hidden="true"></svg>
  <div class="ring r1" id="r1"></div>
  <div class="ring r2" id="r2"></div>
  <div class="ring r3" id="r3"></div>
  <div id="nodes"></div>

  <a class="core" id="core" href="events.html">
    <span class="halo"></span><span class="halo"></span><span class="halo"></span>
    <span class="lbl">EVENTS</span>
    <span class="sub">8 shows · 2026</span>
    <span class="arrow">▾</span>
  </a>
</div>

<div class="foot">
  <h1>Everything the CS team needs — in one place.</h1>
  <p>Pick an event to open its knowledge base · Search it, copy it, done.</p>
</div>

<div class="warp"></div>

<script>
(function(){
  var EVENTS = [
    {name:'Pharmaconex',   href:'pharmaconex.html'},
    {name:'Sahara Expo',   href:'sahara.html'},
    {name:'Autotech',      href:'autotech.html'},
    {name:'Cityscape',     href:'cityscape.html'},
    {name:'Egypt Energy',  href:'egyptenergy.html'},
    {name:'WHX Joburg',    href:'whx.html'},
    {name:'WHX Nairobi',   href:'nairobi.html'},
    {name:'Nigeria Energy',href:'nigeria.html'}
  ];

  var stage = document.getElementById('stage'),
      web   = document.getElementById('web'),
      wrap  = document.getElementById('nodes'),
      core  = document.getElementById('core'),
      rings = [document.getElementById('r1'),document.getElementById('r2'),document.getElementById('r3')];

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var els = [], lines = [], poly;

  // build chips + connecting web
  var ns = 'http://www.w3.org/2000/svg';
  poly = document.createElementNS(ns,'polygon');
  web.appendChild(poly);
  EVENTS.forEach(function(ev,i){
    var a = document.createElement('a');
    a.className = 'node';
    a.href = ev.href;
    a.innerHTML = '<span class="dot"></span>' + ev.name;
    a.style.animation = 'chipIn .7s ' + (0.45 + i*0.07) + 's both';
    a.addEventListener('mouseenter', function(){ hovered = i; });
    a.addEventListener('mouseleave', function(){ hovered = -1; });
    a.addEventListener('click', function(e){ leave(e, ev.href); });
    wrap.appendChild(a); els.push(a);

    var ln = document.createElementNS(ns,'line');
    web.appendChild(ln); lines.push(ln);
  });

  var size = 0, R = 0, spin = 0, boost = 0, boostFrom = 0, boostT = 0, hovered = -1;
  var px = 0, py = 0, mx = 0, my = 0;

  function measure(){
    size = stage.clientWidth;
    R = size * (size < 560 ? 0.345 : 0.425);   // keep the chips inside the viewport on phones
    web.setAttribute('viewBox','0 0 ' + size + ' ' + size);
    place();                                   // don't wait for a frame (rAF is paused on hidden tabs)
  }

  // hover on the core kicks a full extra turn (a nod to the original KB spin)
  core.addEventListener('mouseenter', function(){ kick(360); });
  core.addEventListener('mouseleave', function(){ kick(-360); });
  core.addEventListener('click', function(e){ leave(e,'events.html'); });

  function kick(deg){
    if(reduced) return;
    boostFrom = boost; boost += deg; boostT = 0;
  }

  // subtle parallax
  if(!reduced){
    window.addEventListener('mousemove', function(e){
      mx = (e.clientX / window.innerWidth - .5) * 26;
      my = (e.clientY / window.innerHeight - .5) * 26;
    });
  }

  var eased = 0, last = performance.now();

  function place(){
    var total = spin + eased, c = size/2, pts = [];
    for(var i=0;i<els.length;i++){
      var ang = (total + i * 360/els.length) * Math.PI/180;
      var r = R * (hovered === i ? 1.06 : 1);
      var x = Math.cos(ang) * r, y = Math.sin(ang) * r;
      els[i].style.transform = 'translate(-50%,-50%) translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
      lines[i].setAttribute('x1', c); lines[i].setAttribute('y1', c);
      lines[i].setAttribute('x2', c + x); lines[i].setAttribute('y2', c + y);
      pts.push((c + x).toFixed(1) + ',' + (c + y).toFixed(1));
    }
    poly.setAttribute('points', pts.join(' '));

    rings[0].style.transform = 'rotate(' + (total * 0.6)  + 'deg)';
    rings[1].style.transform = 'rotate(' + (-total * 0.4) + 'deg)';
    rings[2].style.transform = 'rotate(' + (total * 0.22) + 'deg)';
  }

  function frame(now){
    var dt = Math.min(64, now - last); last = now;

    if(!reduced){
      spin += dt * 0.0042;                       // slow constant drift
      boostT = Math.min(1, boostT + dt/1400);    // ease the hover kick
      var t = 1 - Math.pow(1 - boostT, 3);
      eased = boostFrom + (boost - boostFrom) * t;
      px += (mx - px) * 0.06; py += (my - py) * 0.06;
      stage.style.marginLeft = px.toFixed(2) + 'px';
      stage.style.marginTop  = py.toFixed(2) + 'px';
    }
    place();
    requestAnimationFrame(frame);
  }

  measure();
  window.addEventListener('resize', measure);
  requestAnimationFrame(frame);

  function leave(e, href){
    if(e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;  // let new-tab clicks through
    e.preventDefault();
    document.body.classList.add('leaving');
    setTimeout(function(){ window.location.href = href; }, reduced ? 0 : 430);
  }
})();
</script>
</body>
</html>
